<script>
  /* ---------------------------------------------------------
     PBA 2K Cyberface Search — fetches JSON data
     --------------------------------------------------------- */

  (function() {
    const searchInput = document.getElementById("cfSearch");
    const resultsEl   = document.getElementById("cfResults");
    const emptyEl     = document.getElementById("cfEmpty");
    const countEl     = document.getElementById("cfCount");
    const clearBtn    = document.getElementById("cfClear");
    const quickBtns   = document.querySelectorAll(".cf-qf-btn");
    /* ---- Source data ---- */
    const RAW_PLAYERS = CYBERFACES_DATA;
    console.log("PBA database loaded: " + RAW_PLAYERS.length + " players");

    /* ---- Pre-compute search fields once ---- */
    const players = RAW_PLAYERS.map(function(p) {
      return {
        name: p.name,
        id: p.id,
        search: (p.name + " " + p.id).toLowerCase()
      };
    });
    countEl.textContent = "Loaded " + players.length + " players";

    /* ---- Render a single result card ---- */
    function renderCard(player) {
      const card = document.createElement("div");
      card.className = "cf-card fade-in";
      card.innerHTML =
        '<div class="cf-card-body">' +
          '<h3 class="cf-card-name">' + escapeHTML(player.name) + '</h3>' +
          '<div class="cf-card-id-row">' +
            '<span class="cf-card-label">Cyberface ID:</span>' +
            '<span class="cf-card-id">' + escapeHTML(player.id) + '</span>' +
          '</div>' +
          '<button class="cf-copy-btn" data-id="' + escapeHTML(player.id) + '" data-name="' + escapeHTML(player.name) + '">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
            ' Copy ID' +
          '</button>' +
        '</div>';
      card.querySelector(".cf-copy-btn").addEventListener("click", function() {
        var id = this.dataset.id;
        navigator.clipboard.writeText(id).then(function() {
          qol2kShowToast("Copied Cyberface ID: " + id);
        }).catch(function() {
          var ta = document.createElement("textarea");
          ta.value = id;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          qol2kShowToast("Copied Cyberface ID: " + id);
        });
      });
      return card;
    }

    /* ---- Simple escape helper ---- */
    function escapeHTML(str) {
      var d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    /* ---- Filter & render ---- */
    var debounceTimer;
    function filterAndRender() {
      var q = searchInput.value.trim().toLowerCase();
      var filtered;
      if (!q) {
        filtered = players.slice(0, 50);
      } else {
        filtered = players.filter(function(p) {
          return p.search.indexOf(q) !== -1;
        }).slice(0, 50);
      }
      countEl.textContent = "Found " + filtered.length + " Player" + (filtered.length !== 1 ? "s" : "");
      resultsEl.innerHTML = "";
      if (filtered.length === 0) {
        emptyEl.classList.add("show");
      } else {
        emptyEl.classList.remove("show");
        var frag = document.createDocumentFragment();
        filtered.forEach(function(p) { frag.appendChild(renderCard(p)); });
        resultsEl.appendChild(frag);
      }
      clearBtn.classList.toggle("show", q.length > 0);
    }

    /* ---- Input event ---- */
    searchInput.addEventListener("input", function() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(filterAndRender, 200);
    });

    /* ---- Clear button ---- */
    clearBtn.addEventListener("click", function() {
      searchInput.value = "";
      filterAndRender();
      searchInput.focus();
    });

    /* ---- Quick filter buttons ---- */
    quickBtns.forEach(function(btn) {
      btn.addEventListener("click", function() {
        searchInput.value = this.dataset.player;
        filterAndRender();
        searchInput.focus();
      });
    });

    /* ---- Initial render (will run again after fetch) ---- */
    filterAndRender();
  })();
</script>
