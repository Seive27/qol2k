<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyberface Search — QOL2K</title>
<meta name="description" content="Search any NBA 2K14 player's cyberface ID used in QOL2K rosters. Find face IDs instantly.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div id="site-nav"></div>

<main id="main">

  <section class="page-header">
    <div class="container">
      <p class="crumb"><a href="index.html">Home</a> / Cyberface Search</p>
      <h1>Cyberface Search</h1>
      <p>Find any player's cyberface ID used in QOL2K rosters. Just start typing — results filter instantly.</p>
    </div>
  </section>

  <section class="section-pad tight">
    <div class="container">

      <!-- Search -->
      <div class="cf-search-wrap">
        <div class="cf-search-box">
          <svg class="cf-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="cfSearch" placeholder="Search player name..." autofocus>
          <button class="cf-clear-btn" id="cfClear" aria-label="Clear search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="cf-count" id="cfCount">Searching 989 players...</div>
      </div>

      <!-- Quick Filters -->
      <div class="cf-quick-filters">
        <span class="cf-qf-label">Featured Prospects</span>
        <div class="cf-qf-buttons" id="cfQuickFilters">
          <button class="cf-qf-btn" data-player="AJ Dybantsa">AJ Dybantsa</button>
          <button class="cf-qf-btn" data-player="Cameron Boozer">Cameron Boozer</button>
          <button class="cf-qf-btn" data-player="Darryn Peterson">Darryn Peterson</button>
          <button class="cf-qf-btn" data-player="Caleb Wilson">Caleb Wilson</button>
          <button class="cf-qf-btn" data-player="Cooper Flagg">Cooper Flagg</button>
          <button class="cf-qf-btn" data-player="Dylan Harper">Dylan Harper</button>
          <button class="cf-qf-btn" data-player="Ace Bailey">Ace Bailey</button>
        </div>
      </div>

      <!-- Results -->
      <div class="cf-results" id="cfResults"></div>
      <div class="cf-empty" id="cfEmpty">
        <svg class="cf-empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <h3>No players found</h3>
        <p>Try another search term.</p>
      </div>

    </div>
  </section>

  <div id="site-credits"></div>

</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/cyberfaces.js"></script>
<script src="js/app.js"></script>
<script>
  /* ---------------------------------------------------------
     Cyberface Search — instant, real-time filtering
     --------------------------------------------------------- */

  (function() {
    const searchInput = document.getElementById("cfSearch");
    const resultsEl   = document.getElementById("cfResults");
    const emptyEl     = document.getElementById("cfEmpty");
    const countEl     = document.getElementById("cfCount");
    const clearBtn    = document.getElementById("cfClear");
    const quickBtns   = document.querySelectorAll(".cf-qf-btn");
    const players     = QOL2K_CYBERFACES;

    /* ---- Render a single result card ---- */
    function renderCard(player) {
      const card = document.createElement("div");
      card.className = "cf-card fade-in";
      card.innerHTML = `
        <div class="cf-card-body">
          <h3 class="cf-card-name">${escapeHTML(player.name)}</h3>
          <div class="cf-card-id-row">
            <span class="cf-card-label">Cyberface ID:</span>
            <span class="cf-card-id">${escapeHTML(player.id)}</span>
          </div>
          <button class="cf-copy-btn" data-id="${escapeHTML(player.id)}" data-name="${escapeHTML(player.name)}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy ID
          </button>
        </div>
      `;

      // Copy handler
      const copyBtn = card.querySelector(".cf-copy-btn");
      copyBtn.addEventListener("click", function() {
        const id = this.dataset.id;
        navigator.clipboard.writeText(id).then(() => {
          qol2kShowToast("Copied Cyberface ID: " + id);
        }).catch(() => {
          // Fallback
          const ta = document.createElement("textarea");
          ta.value = id;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          qol2kShowToast("Copied Cyberface ID: " + id);
        });
      });

      return card;
    }

    /* ---- Simple escape helper ---- */
    function escapeHTML(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    /* ---- Filter & render ---- */
    function filterAndRender() {
      const q = searchInput.value.trim().toLowerCase();

      let filtered;
      if (!q) {
        filtered = players;
      } else {
        filtered = players.filter(p => p.name.toLowerCase().includes(q));
      }

      // Update count
      countEl.textContent = "Found " + filtered.length + " Player" + (filtered.length !== 1 ? "s" : "");

      // Clear & render
      resultsEl.innerHTML = "";
      if (filtered.length === 0) {
        emptyEl.classList.add("show");
      } else {
        emptyEl.classList.remove("show");
        // Use DocumentFragment for performance
        const frag = document.createDocumentFragment();
        filtered.forEach(p => frag.appendChild(renderCard(p)));
        resultsEl.appendChild(frag);
      }

      // Show/hide clear button
      clearBtn.classList.toggle("show", q.length > 0);
    }

    /* ---- Input event (instant) ---- */
    searchInput.addEventListener("input", filterAndRender);

    /* ---- Clear button ---- */
    clearBtn.addEventListener("click", function() {
      searchInput.value = "";
      filterAndRender();
      searchInput.focus();
    });

    /* ---- Quick filter buttons ---- */
    quickBtns.forEach(btn => {
      btn.addEventListener("click", function() {
        searchInput.value = this.dataset.player;
        filterAndRender();
        searchInput.focus();
      });
    });

    /* ---- Initial render ---- */
    filterAndRender();
  })();
</script>
<style>
  /* =========================================================
     Cyberface Search — page-specific styles
     ========================================================= */

  /* ---- Search wrapper ---- */
  .cf-search-wrap {
    padding: 8px 0 12px;
  }

  .cf-search-box {
    position: relative;
    max-width: 580px;
  }

  .cf-search-box input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 17px;
    padding: 16px 48px 16px 48px;
    border-radius: var(--radius-md);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    outline: none;
  }

  .cf-search-box input:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 4px var(--red-subtle), 0 8px 24px rgba(0,0,0,0.3);
  }

  .cf-search-box input::placeholder {
    color: var(--text-mute);
  }

  .cf-search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    color: var(--text-mute);
    pointer-events: none;
  }

  .cf-clear-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--panel-hover);
    color: var(--text-dim);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .cf-clear-btn:hover {
    background: var(--red-bg);
    color: var(--red);
  }
  .cf-clear-btn.show {
    display: inline-flex;
  }
  .cf-clear-btn svg {
    width: 14px;
    height: 14px;
  }

  /* ---- Result count ---- */
  .cf-count {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 14px;
    transition: color 0.2s ease;
  }

  /* ---- Quick filters ---- */
  .cf-quick-filters {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 20px 0 24px;
    border-bottom: 1px solid var(--panel-border-soft);
    margin-bottom: 28px;
  }

  .cf-qf-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-mute);
    margin-right: 4px;
  }

  .cf-qf-btn {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.18s ease;
    white-space: nowrap;
  }

  .cf-qf-btn:hover {
    color: var(--red);
    border-color: var(--red-dim);
    background: var(--red-bg);
    transform: translateY(-1px);
  }

  .cf-qf-btn:active {
    transform: translateY(0);
  }

  /* ---- Results grid ---- */
  .cf-results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  /* ---- Result card ---- */
  .cf-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-md);
    overflow: hidden;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .cf-card:hover {
    transform: translateY(-3px);
    border-color: var(--red-dim);
    box-shadow: 0 12px 32px rgba(0,0,0,0.35);
  }

  .cf-card-body {
    padding: 20px 22px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .cf-card-name {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text);
    margin: 0;
    line-height: 1.15;
  }

  .cf-card-id-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-dim);
  }

  .cf-card-label {
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-mute);
  }

  .cf-card-id {
    font-size: 22px;
    font-weight: 700;
    color: var(--red);
    letter-spacing: 0.02em;
  }

  .cf-copy-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 9px 16px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--red-dim);
    background: var(--red-bg);
    color: var(--red);
    cursor: pointer;
    transition: all 0.18s ease;
    align-self: flex-start;
    margin-top: 2px;
  }

  .cf-copy-btn:hover {
    background: var(--red);
    color: #fff;
    box-shadow: 0 4px 16px var(--red-glow);
    transform: translateY(-1px);
  }

  .cf-copy-btn:active {
    transform: translateY(0);
  }

  .cf-copy-btn svg {
    flex-shrink: 0;
  }

  /* ---- Empty state ---- */
  .cf-empty {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    text-align: center;
    border: 1px dashed var(--panel-border);
    border-radius: var(--radius-md);
  }

  .cf-empty.show {
    display: flex;
  }

  .cf-empty-icon {
    width: 44px;
    height: 44px;
    color: var(--text-mute);
    margin-bottom: 16px;
    opacity: 0.5;
  }

  .cf-empty h3 {
    font-family: var(--font-display);
    font-size: 22px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .cf-empty p {
    font-size: 14px;
    color: var(--text-mute);
    margin: 0;
  }

  /* ---- Fade-in animation ---- */
  .cf-card.fade-in {
    animation: cfFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes cfFadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---- Responsive ---- */
  @media (max-width: 600px) {
    .cf-search-box input {
      font-size: 15px;
      padding: 14px 44px 14px 44px;
    }

    .cf-results {
      grid-template-columns: 1fr;
    }

    .cf-quick-filters {
      gap: 8px;
    }

    .cf-qf-btn {
      font-size: 12px;
      padding: 6px 13px;
    }
  }
</style>
</body>
</html>
