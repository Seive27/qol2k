<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReShade — QOL2K</title>
<meta name="description" content="Visual presets and shader tweaks for improved lighting, color, and clarity.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div id="site-nav"></div>

<main id="main">

  <section class="page-header">
    <div class="container">
      <p class="crumb"><a href="index.html">Home</a> / ReShade</p>
      <h1>ReShade</h1>
      <p>Visual presets and shader tweaks for improved lighting, color, and clarity.</p>
    </div>
  </section>

  <section class="section-pad tight">
    <div class="container">
      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="modSearch" placeholder="Search reshade by title or author...">

        <div class="filter-chips">
          <span class="filter-chip active">All</span>
          <span class="filter-chip">Newest</span>
          <span class="filter-chip">Most Downloaded</span>

        <span class="filter-note">More filters coming soon</span>
      </div>

      <div class="mod-grid" id="modGrid"></div>
      <div class="result-empty" id="modEmpty">No reshade mods match your search yet.</div>
    </div>
  </section>

  <div id="site-credits"></div>

</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  qol2kRenderNav("reshade");
  qol2kRenderFooter();
  qol2kRenderCredits();
  qol2kRenderModGrid("modGrid", "reshade");
  qol2kInitSearch("modSearch", "modGrid", "modEmpty");
  qol2kInitReveal();
</script>
</body>
